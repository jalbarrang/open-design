<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="theme-color" content="#f7f7f7" />
    <title>OpenDesign</title>
    <!--
      Inline script that runs before React loads so the first paint already
      carries the app's appearance — no flash of unstyled content.

      The stored theme decides the attribute, and the stamping is deliberately
      OUTSIDE the try/catch: an explicit 'dark' stamps dark, 'system' leaves
      the attribute absent (the CSS prefers-color-scheme blocks resolve it),
      and everything else stamps 'light' — the shipped default. A broken
      storage read must still leave the attribute stamped so a dark OS never
      leaks in unintentionally. Keep the accent variable mix ratios in sync
      with `accentVars()` in `src/state/appearance.ts`; this script cannot
      import application modules.
    -->
    <script>
      (function(){var t='light';try{var c=JSON.parse(localStorage.getItem('open-design:config')||'{}');if(c.theme==='dark')t='dark';else if(c.theme==='system')t=null;}catch(e){}if(t===null){document.documentElement.removeAttribute('data-theme');}else{document.documentElement.setAttribute('data-theme',t);}try{var c2=JSON.parse(localStorage.getItem('open-design:config')||'{}');var a=typeof c2.accentColor==='string'&&/^#[0-9a-fA-F]{6}$/.test(c2.accentColor.trim())?c2.accentColor.trim().toLowerCase():'#353535';if(c2.configMigrationVersion!==3&&(a==='#87ea5c'||a==='#c96442'))a='#353535';var s=document.documentElement.style;s.setProperty('--accent',a);s.setProperty('--accent-strong','color-mix(in srgb, '+a+' 82%, var(--text-strong))');s.setProperty('--accent-soft','color-mix(in srgb, '+a+' 12%, var(--bg-subtle))');s.setProperty('--accent-tint','color-mix(in srgb, '+a+' 6%, var(--bg-panel))');s.setProperty('--accent-hover','color-mix(in srgb, '+a+' 86%, var(--text-strong))');}catch(e){}})();
    </script>
  </head>
  <body suppressHydrationWarning>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
